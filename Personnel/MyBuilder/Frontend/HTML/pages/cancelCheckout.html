<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout canceled</title>

  <!-- #region CSS links -->
  <!-- Site icon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.svg">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <!-- Bootstrap icons CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- #endregion CSS links -->
</head>

<body>
  <!-- #region Home page -->
  <header>
    <nav class="navbar navbar-expand-lg bg-success-subtle">
      <div class="container-fluid">
        <a class="navbar-brand fs-1" href="#">
          <i class="bi bi-tools"></i>
          MyBuilder
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
              <i class="bi bi-tools"></i>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body align-items-center text-center fs-5">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 gap-2">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Categories
                </a>
                <ul id="categoriesDropdown" class="dropdown-menu">
                </ul>
              </li>
              <li class="nav-item d-flex justify-content-around align-items-center me-4">
                <a class="nav-link" type="button" onclick="switchTheme()">
                  <i id="themeSwitcher" class="bi bi-moon-stars-fill"></i>
                </a>
                <a class="nav-link position-relative me-2" type="button" data-bs-toggle="modal"
                  data-bs-target="#cartModal" aria-label="cart">
                  <i class="bi bi-cart-fill"></i>
                  <span id="cartQuantity"
                    class="position-absolute top-25 start-100 translate-middle badge rounded-circle bg-secondary d-none">
                  </span>
                </a>
                <a class="nav-link position-relative" type="button" data-bs-toggle="modal" data-bs-target="#loginModal"
                  aria-label="Login">
                  <i id="loginLink" class="bi bi-person-circle fs-4"></i>
                  <span id="userStatus"
                    class="position-absolute top-25 start-75 translate-middle mt-1 p-2 bg-success border border-light rounded-circle d-none">
                    <span class="visually-hidden">Connected</span>
                  </span>
                </a>
                <button id="logoutLink" class="btn btn-link d-none" onclick="disconnect()">
                  Logout
                </button>
              </li>
              <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">Search</button>
              </form>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="px-4 py-5 my-5 text-center">
    <p class="lead mb-4">Forgot to add something to your cart? Shop around then come back to pay!</p>
    <a href="../index.html">Go back to home</a>
  </main>

  <footer class="d-flex flex-wrap justify-content-between align-items-center px-5 py-5 mt-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <a href="#" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">
        <i class="bi bi-bootstrap-fill"></i>
      </a>
      <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span>
    </div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3">
        <a class="text-body-secondary" href="#" aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
      </li>
      <li class="ms-3">
        <a class="text-body-secondary" href="#" aria-label="Facebook">
          <i class="bi bi-facebook"></i>
        </a>
      </li>
    </ul>
  </footer>
  <!-- #endregion Home page -->

  <!-- #region JS scripts -->
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
</body>

</html>
