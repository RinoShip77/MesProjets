<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBuilder
  </title>
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-bs-theme="light">
  <header>
    <nav class="navbar navbar-expand-lg bg-success-subtle">
      <div class="container-fluid">
        <a class="navbar-brand fs-1" href="#">
          <i class="bi bi-tools"></i>
          MyBuilder
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
              <i class="bi bi-tools"></i>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body align-items-center fs-5">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Categories
                </a>
                <ul id="categoriesDropdown" class="dropdown-menu">
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link" type="button" data-bs-toggle="modal" data-bs-target="#loginModal"
                  aria-label="Login">
                  <i class="bi bi-person-circle"></i>
                </a>
              </li>
              <li class="nav-item me-2">
                <a class="nav-link position-relative" aria-label="cart">
                  <i class="bi bi-cart-fill"></i>
                  <span id="cartQuantity"
                    class="position-absolute top-25 start-100 translate-middle badge rounded-circle bg-secondary">
                    0
                  </span>
                </a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="row d-flex justify-content-center p-5">
      <div class="col-auto">
        <h1>Categories</h1>
        <div id="categoriesContainer" class="ms-3 fs-5"></div>
      </div>
      <div class="col-9 ms-xl-auto">
        <div id="productsContainer"
          class="row row-cols-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-4 overflow-y-scroll" style="height: 75vh;">
        </div>
      </div>
    </div>
  </main>

  <footer class="d-flex flex-wrap justify-content-between align-items-center px-5 py-5 mt-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <a href="#" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">
        <i class="bi bi-bootstrap-fill"></i>
      </a>
      <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span>
    </div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3">
        <a class="text-body-secondary" href="#" aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
      </li>
      <li class="ms-3">
        <a class="text-body-secondary" href="#" aria-label="Facebook">
          <i class="bi bi-facebook"></i>
        </a>
      </li>
    </ul>
  </footer>

  <!-- Login modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title text-center fs-5">Connexion</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-column justify-content-center align-items-center">
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-at"></i>
              </span>
              <input id="email" class="form-control" type="email"
                placeholder="Please enter your email address.">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-shield-lock"></i>
              </span>
              <input id="password" class="form-control" type="password"
                placeholder="Please enter your password.">
            </div>
            <button class="btn btn-dark fs-4 mt-3 ps-3 pe-3" onclick="login(document.getElementById('email').value, document.getElementById('password').value)">
              Login<i class="bi bi-unlock2-fill ms-3"></i>
            </button>
          </div>
        </div>
        <div class="text-center">
          <p>No account yet?<a href="#" class="text-decoration-none text-dark fw-bold fs-5 ms-2">
            Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add to cart toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <img id="toastImage" class="rounded me-2" width="35" height="35">
        <strong id="toastTitle" class="me-auto"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div id="toastMessage" class="toast-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
