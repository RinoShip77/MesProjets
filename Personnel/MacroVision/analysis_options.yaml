linter:
  rules:
    # --- STYLE & CONSISTENCY ---
    - prefer_single_quotes # Standardizes on '...' for a cleaner look
    - require_trailing_commas # Forces commas after last parameters to keep formatting vertical
    - sort_child_properties_last # Always keep 'child' at the bottom of a widget's code for readability
    - always_declare_return_types # Prevents accidentally returning 'dynamic'
    - unnecessary_lambdas # Replaces () => _method() with just _method for cleaner callback syntax
    - sort_pub_dependencies # Keeps your pubspec.yaml file alphabetically organized

    # --- PERFORMANCE ---
    - prefer_const_constructors # Critical for widget reuse and performance
    - prefer_const_declarations # Encourages 'const' over 'final' for compile-time optimizations
    - avoid_unnecessary_containers # Prevents using Container when SizedBox/Padding is enough
    
    # --- ERROR PREVENTION ---
    - use_build_context_synchronously # Prevents crashes when using context after an 'await' call
    - avoid_print # Ensures debug logs don't leak into production; use debugPrint instead
    - unawaited_futures # Catches async calls that aren't awaited or explicitly handled
    - no_literal_bool_comparisons # Forces idiomatic if(isReady) instead of if(isReady == true)
    - use_key_in_widget_constructors # Essential for Flutter to correctly track widget state
    - avoid_void_async # Prevents returning 'void' from async functions; forces Future<void> instead
    - prefer_final_locals # Encourages immutability by using 'final' for variables that don't change
