# =============================================================================
# PROJECT QUALITY RULES & MAINTENANCE
# =============================================================================
# TO ANALYZE: Run 'flutter analyze' in the terminal to find all violations.
# TO FIX AUTOMATICALLY: Run 'dart fix --apply' to resolve most style issues
# (like quotes, consts, and commas) across the entire project automatically.
# =============================================================================

include: package:flutter_lints/flutter.yaml

