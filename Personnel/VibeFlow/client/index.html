<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFlow | Terminal Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Styles du Markdown optimisés */
        .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.75rem; margin-bottom: 0.75rem; border: 1px solid #374151; }
        .prose code { color: #10b981; font-family: monospace; }
        .prose p { margin-bottom: 0.75rem; }
        .prose a { color: #3b82f6; text-decoration: underline; }
        
        /* Animations fluides */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
        
        /* Curseur de frappe */
        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #10b981;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scrollbar "Smooth" */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        #chat-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans selection:bg-green-500 selection:text-white">

    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center shrink-0 border-b border-gray-700">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.7)]"></div>
            <h1 class="text-xl font-bold tracking-wider">VIBE<span class="text-green-400">FLOW</span></h1>
        </div>
        <span class="text-xs text-green-400 bg-green-900/30 border border-green-800 px-2 py-1 rounded">UX Avancée Active</span>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6">
        <div class="flex gap-4">
            <div class="w-8 h-8 rounded bg-green-600 flex items-center justify-center font-bold shrink-0 shadow-lg shadow-green-900/50">V</div>
            <div class="bg-gray-800 p-4 rounded-lg rounded-tl-none max-w-3xl shadow-sm border border-gray-700">
                <p>Noyau connecté. Utilitaires de session activés. Prêt, Oli.</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 p-4 shrink-0 border-t border-gray-700 relative z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)]">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all placeholder-gray-500 text-gray-100 shadow-inner"
                placeholder="Tape ta commande..."
                autocomplete="off"
            >
            <button 
                id="send-btn"
                class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2 shadow-lg shadow-green-900/20"
            >
                <span>Envoyer</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const API_URL = 'http://127.0.0.1:8000/stream';

        // --- Utilitaires de la barre d'action ---
        
        async function copyToClipboard(button, encodedText) {
            try {
                const text = decodeURIComponent(encodedText);
                await navigator.clipboard.writeText(text);
                
                // Feedback visuel du bouton
                const originalContent = button.innerHTML;
                button.innerHTML = `<svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-400">Copié !</span>`;
                
                setTimeout(() => {
                    button.innerHTML = originalContent;
                }, 2000);
            } catch (err) {
                console.error("Erreur de copie :", err);
            }
        }

        function reactEmoji(button) {
            // Effet visuel simple de sélection/désélection
            button.classList.toggle('bg-gray-700');
            button.classList.toggle('rounded');
            button.classList.toggle('px-1');
            button.classList.toggle('scale-110');
        }

        // --- Fonctions de Chat ---

        function appendUserMessage(text) {
            const msgHTML = `
                <div class="flex gap-4 flex-row-reverse animate-fade-in-up">
                    <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold shrink-0 shadow-lg shadow-blue-900/50">O</div>
                    <div class="bg-blue-900/20 p-4 rounded-lg rounded-tr-none max-w-3xl shadow-sm border border-blue-800/50 prose prose-invert">
                        <p>${text}</p>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', msgHTML);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const msgId = 'msg-' + Date.now();
            const bubbleId = 'bubble-' + msgId;
            
            // Structure de la bulle IA (inclut le conteneur texte + l'espace pour la barre d'outils)
            const aiMsgHTML = `
                <div class="flex gap-4 flex-row animate-fade-in-up">
                    <div class="w-8 h-8 rounded bg-green-600 flex items-center justify-center font-bold shrink-0 shadow-lg shadow-green-900/50">V</div>
                    <div id="${bubbleId}" class="bg-gray-800 p-4 rounded-lg rounded-tl-none max-w-3xl w-full shadow-sm border border-gray-700 flex flex-col">
                        <div id="${msgId}" class="prose prose-invert w-full max-w-none"></div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', aiMsgHTML);
            scrollToBottom();

            const aiMessageContainer = document.getElementById(msgId);
            const aiBubble = document.getElementById(bubbleId);
            let accumulatedText = "";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    accumulatedText += decoder.decode(value, { stream: true });
                    aiMessageContainer.innerHTML = marked.parse(accumulatedText) + '<span class="blinking-cursor"></span>';
                    scrollToBottom();
                }

                // Streaming terminé : On retire le curseur
                aiMessageContainer.innerHTML = marked.parse(accumulatedText);

                // Ajout de la barre d'outils utilitaire avec un effet de fondu (Fade-in)
                const safeEncodedText = encodeURIComponent(accumulatedText);
                const toolbarHTML = `
                    <div class="mt-4 pt-3 border-t border-gray-700/50 flex gap-4 text-gray-400 text-sm animate-fade-in-up">
                        <button onclick="copyToClipboard(this, '${safeEncodedText}')" class="hover:text-green-400 transition-all flex items-center gap-1 group">
                            <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>Copier</span>
                        </button>
                        <div class="w-px h-4 bg-gray-700 self-center"></div> <button onclick="reactEmoji(this)" class="hover:text-blue-400 transition-all flex items-center justify-center w-6 h-6 rounded-full hover:bg-blue-900/30" title="Bonne réponse">
                            👍
                        </button>
                        <button onclick="reactEmoji(this)" class="hover:text-red-400 transition-all flex items-center justify-center w-6 h-6 rounded-full hover:bg-red-900/30" title="Mauvaise réponse">
                            👎
                        </button>
                        <button onclick="reactEmoji(this)" class="hover:text-yellow-400 transition-all flex items-center justify-center w-6 h-6 rounded-full hover:bg-yellow-900/30" title="Excellente idée !">
                            💡
                        </button>
                    </div>
                `;
                aiBubble.insertAdjacentHTML('beforeend', toolbarHTML);
                scrollToBottom();

            } catch (error) {
                aiMessageContainer.innerHTML = `<p class="text-red-400 font-semibold">❌ Erreur système : ${error.message}</p>`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        userInput.focus();
    </script>
</body>
</html>
