<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFlow | Terminal Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --accent: #10b981; 
            --bg-body: #111827; 
            --bg-surface: #1f2937; 
            --bg-input: #111827;
            --text-main: #f3f4f6; 
            --text-muted: #9ca3af; 
            --border-color: #374151; 
            --wallpaper: none;
            --blur-amount: 0px;
        }

        .theme-light {
            --bg-body: #f3f4f6; 
            --bg-surface: #ffffff; 
            --bg-input: #f9fafb; 
            --text-main: #111827; 
            --text-muted: #4b5563; 
            --border-color: #e5e7eb; 
        }

        body { background-color: var(--bg-body); color: var(--text-main); }
        .wallpaper-container { position: fixed; inset: 0; z-index: -1; background-image: var(--wallpaper); background-size: cover; background-position: center; filter: blur(var(--blur-amount)); opacity: 0.4; }
        
        .surface { background-color: var(--bg-surface); border-color: var(--border-color); }
        .input-bg { background-color: var(--bg-input); color: var(--text-main); border-color: var(--border-color); }
        .accent-bg { background-color: var(--accent); color: #fff; }
        .accent-text { color: var(--accent); }
        .text-muted { color: var(--text-muted); }
        
        .prose pre { background-color: #00000030; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; border: 1px solid var(--border-color); }
        .prose code { color: var(--accent); font-family: monospace; }
        .prose p { margin-bottom: 0.75rem; }
        .prose a { color: var(--accent); text-decoration: underline; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
        .blinking-cursor { display: inline-block; width: 8px; height: 1.2em; background-color: var(--accent); vertical-align: text-bottom; animation: blink 1s step-end infinite; margin-left: 4px; }
        @keyframes blink { 50% { opacity: 0; } }

        .dot-pulse { display: flex; gap: 6px; align-items: center; height: 1.5rem; }
        .dot-pulse div { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent); animation: bounce 1.4s infinite ease-in-out both; }
        .dot-pulse div:nth-child(1) { animation-delay: -0.32s; }
        .dot-pulse div:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        #chat-container { scroll-behavior: smooth; }
        .fade-overlay { background: linear-gradient(to bottom, var(--bg-body) 0%, transparent 100%); }
    </style>
</head>
<body class="h-screen flex flex-col font-sans transition-colors duration-300">

    <div class="wallpaper-container"></div>

    <header class="surface p-4 shadow-md flex justify-between items-center shrink-0 border-b border-solid transition-colors duration-300 relative z-20">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full animate-pulse accent-bg" style="box-shadow: 0 0 10px var(--accent);"></div>
            <h1 class="text-xl font-bold tracking-wider">VIBE<span class="accent-text">FLOW</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="mock-badge" class="hidden items-center gap-2 bg-yellow-900/30 text-yellow-400 border border-yellow-800 px-3 py-1 rounded shadow-[0_0_10px_rgba(234,179,8,0.2)]">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>
                </span>
                <span class="text-xs font-bold tracking-wider">MOCK MODE</span>
            </div>

            <span id="model-badge" class="text-xs text-green-400 bg-green-900/30 border border-green-800 px-2 py-1 rounded transition-colors duration-300">
                Moteur Flash (Vitesse)
            </span>
            <button onclick="toggleSettings()" class="text-muted hover:text-[var(--text-main)] transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <div class="relative flex-1 flex flex-col overflow-hidden z-10">
        <div class="fade-overlay absolute top-0 left-0 right-0 h-8 z-20 pointer-events-none transition-colors duration-300"></div>
        <main id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-8 flex flex-col gap-6 pt-8 pb-6 relative z-10"></main>
    </div>

    <footer class="surface p-4 shrink-0 relative z-20 shadow-[0_-15px_25px_-5px_rgba(0,0,0,0.3)] transition-colors duration-300">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 input-bg border border-solid rounded-lg px-4 py-3 focus:outline-none focus:ring-1 transition-all shadow-inner"
                style="--tw-ring-color: var(--accent)"
                placeholder="Tape ta commande..."
                autocomplete="off"
            >
            <button 
                id="send-btn"
                class="accent-bg font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2 shadow-lg opacity-90 hover:opacity-100"
            >
                <span>Envoyer</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" /></svg>
            </button>
        </div>
    </footer>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm animate-fade-in-up">
        <div class="surface p-6 rounded-xl border border-solid shadow-2xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2" style="border-color: var(--border-color)">Configuration VibeFlow</h2>
            
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Cerveau IA (Modèle)</label>
                    <select id="cfg-model" class="w-full input-bg border border-solid rounded px-3 py-2 focus:outline-none">
                        <option value="gemini-2.5-flash">Gemini Flash (Vitesse Max)</option>
                        <option value="gemini-2.5-pro">Gemini Pro (Réflexion Profonde)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nom d'utilisateur</label>
                    <input type="text" id="cfg-username" class="w-full input-bg border border-solid rounded px-3 py-2 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Thème de Base</label>
                    <select id="cfg-theme" class="w-full input-bg border border-solid rounded px-3 py-2 focus:outline-none">
                        <option value="dark">Sombre (Défaut)</option>
                        <option value="light">Clair</option>
                        <option value="system">Système (Auto)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Couleur d'Accentuation</label>
                    <input type="color" id="cfg-color" class="h-10 w-10 border-0 rounded cursor-pointer bg-transparent">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Fond d'écran (URL Optionnelle)</label>
                    <input type="text" id="cfg-wallpaper" class="w-full input-bg border border-solid rounded px-3 py-2 focus:outline-none">
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-[var(--border-color)] flex justify-between items-center">
                <button onclick="clearDatabase()" class="text-red-500 hover:text-red-400 text-sm font-bold flex items-center gap-1 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Effacer la mémoire
                </button>
                <div class="flex gap-3">
                    <button onclick="toggleSettings()" class="px-4 py-2 rounded border border-solid hover:bg-gray-500/20 transition-colors">Annuler</button>
                    <button onclick="saveSettings()" class="px-4 py-2 rounded accent-bg font-bold opacity-90 hover:opacity-100 transition-colors">Sauvegarder</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('settings-modal');
        const modelBadge = document.getElementById('model-badge');
        const mockBadge = document.getElementById('mock-badge');
        const API_URL = 'http://127.0.0.1:8000';

        let config = { username: "Oli", theme: "dark", accent: "#10b981", wallpaper: "", model: "gemini-2.5-flash" };

        function loadSettings() {
            const saved = localStorage.getItem('vibeflow_cfg');
            if (saved) config = { ...config, ...JSON.parse(saved) };
            
            document.getElementById('cfg-username').value = config.username;
            document.getElementById('cfg-theme').value = config.theme;
            document.getElementById('cfg-color').value = config.accent;
            document.getElementById('cfg-wallpaper').value = config.wallpaper;
            
            const modelSelect = document.getElementById('cfg-model');
            if(Array.from(modelSelect.options).some(opt => opt.value === config.model)) modelSelect.value = config.model;
            
            applySettings();
        }

        function saveSettings() {
            config.username = document.getElementById('cfg-username').value.trim() || "Oli";
            config.theme = document.getElementById('cfg-theme').value;
            config.accent = document.getElementById('cfg-color').value;
            config.wallpaper = document.getElementById('cfg-wallpaper').value.trim();
            config.model = document.getElementById('cfg-model').value;
            
            localStorage.setItem('vibeflow_cfg', JSON.stringify(config));
            applySettings();
            toggleSettings();
        }

        function applySettings() {
            const root = document.documentElement;
            root.style.setProperty('--accent', config.accent);
            
            if(config.wallpaper) {
                root.style.setProperty('--wallpaper', `url('${config.wallpaper}')`);
                root.style.setProperty('--blur-amount', '8px');
            } else {
                root.style.setProperty('--wallpaper', 'none');
            }

            document.body.classList.remove('theme-light', 'theme-dark');
            let activeTheme = config.theme;
            if (activeTheme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                activeTheme = prefersDark ? 'dark' : 'light';
            }
            if (activeTheme === 'light') document.body.classList.add('theme-light');

            if(config.model === 'gemini-2.5-pro') {
                modelBadge.innerText = 'Moteur Pro (Analytique)';
                modelBadge.className = "text-xs text-purple-400 bg-purple-900/30 border border-purple-800 px-2 py-1 rounded transition-colors duration-300";
            } else {
                modelBadge.innerText = 'Moteur Flash (Vitesse)';
                modelBadge.className = "text-xs text-green-400 bg-green-900/30 border border-green-800 px-2 py-1 rounded transition-colors duration-300";
            }
        }

        function toggleSettings() { modal.classList.toggle('hidden'); }

        async function copyToClipboard(button, encodedText) {
            try {
                await navigator.clipboard.writeText(decodeURIComponent(encodedText));
                const originalContent = button.innerHTML;
                button.innerHTML = `<span class="accent-text font-bold">✓ Copié</span>`;
                setTimeout(() => button.innerHTML = originalContent, 2000);
            } catch (err) { console.error(err); }
        }

        function scrollToBottom() { 
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); 
        }

        function renderUserMessage(text, animate = true) {
            const initial = config.username.charAt(0).toUpperCase();
            const animClass = animate ? "animate-fade-in-up" : "";
            const html = `
                <div class="flex gap-4 flex-row-reverse ${animClass}">
                    <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold shrink-0 shadow-lg">${initial}</div>
                    <div class="bg-blue-600/20 p-4 rounded-lg rounded-tr-none max-w-3xl shadow-sm border border-blue-500/30 prose prose-invert">
                        <p style="color: var(--text-main)">${text}</p>
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', html);
        }

        function renderAIMessage(text, animate = true) {
            const animClass = animate ? "animate-fade-in-up" : "";
            const safeEncodedText = encodeURIComponent(text).replace(/'/g, "%27");
            const html = `
                <div class="flex gap-4 flex-row ${animClass}">
                    <div class="w-8 h-8 rounded accent-bg flex items-center justify-center font-bold shrink-0 shadow-lg">V</div>
                    <div class="surface p-4 rounded-lg rounded-tl-none max-w-3xl w-full shadow-sm border border-solid flex flex-col">
                        <div class="prose max-w-none text-[var(--text-main)]">${marked.parse(text)}</div>
                        <div class="mt-4 pt-3 border-t border-[var(--border-color)] flex gap-4 text-muted text-sm">
                            <button onclick="copyToClipboard(this, '${safeEncodedText}')" class="hover:text-[var(--accent)] transition-all flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span>Copier</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', html);
        }

        async function loadDatabaseHistory() {
            try {
                const res = await fetch(`${API_URL}/history`);
                const data = await res.json();
                
                // Vérifie si le backend a activé le USE_MOCK_API
                if (data.mock_mode) {
                    mockBadge.classList.remove('hidden');
                    mockBadge.classList.add('flex');
                } else {
                    mockBadge.classList.add('hidden');
                    mockBadge.classList.remove('flex');
                }
                
                chatContainer.innerHTML = ''; 
                
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => {
                        if (msg.role === 'user') renderUserMessage(msg.content, false);
                        else renderAIMessage(msg.content, false);
                    });
                } else {
                    const welcomeHtml = `
                        <div class="flex gap-4">
                            <div class="w-8 h-8 rounded accent-bg flex items-center justify-center font-bold shrink-0 shadow-lg">V</div>
                            <div class="surface p-4 rounded-lg rounded-tl-none max-w-3xl shadow-sm border border-solid">
                                <p>Noyau connecté. Interface stabilisée. Prêt pour le déploiement.</p>
                            </div>
                        </div>`;
                    chatContainer.insertAdjacentHTML('beforeend', welcomeHtml);
                }
                setTimeout(scrollToBottom, 100); 
            } catch (err) { console.error("Erreur DB:", err); }
        }

        async function clearDatabase() {
            if(!confirm("Supprimer tout l'historique de cette session ?")) return;
            try {
                await fetch(`${API_URL}/clear`, { method: 'POST' });
                location.reload(); 
            } catch (err) { console.error("Erreur suppression:", err); }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            renderUserMessage(text, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            const msgId = 'msg-' + Date.now();
            const bubbleId = 'bubble-' + msgId;
            const loaderHTML = `<div class="dot-pulse"><div></div><div></div><div></div></div>`;
            
            const aiMsgHTML = `
                <div class="flex gap-4 flex-row animate-fade-in-up">
                    <div class="w-8 h-8 rounded accent-bg flex items-center justify-center font-bold shrink-0 shadow-lg">V</div>
                    <div id="${bubbleId}" class="surface p-4 rounded-lg rounded-tl-none max-w-3xl w-full shadow-sm border border-solid flex flex-col min-h-[56px] justify-center">
                        <div id="${msgId}" class="prose max-w-none text-[var(--text-main)]">${loaderHTML}</div>
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', aiMsgHTML);
            scrollToBottom();

            const aiMessageContainer = document.getElementById(msgId);
            const aiBubble = document.getElementById(bubbleId);
            let accumulatedText = "";
            let isFirstChunk = true;

            try {
                const response = await fetch(`${API_URL}/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, model: config.model })
                });

                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let lastRenderTime = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    accumulatedText += decoder.decode(value, { stream: true });
                    
                    if (isFirstChunk) {
                        aiMessageContainer.innerHTML = ''; 
                        aiBubble.classList.remove('justify-center');
                        isFirstChunk = false;
                    }
                    
                    const now = Date.now();
                    if (now - lastRenderTime > 30) {
                        aiMessageContainer.innerHTML = marked.parse(accumulatedText) + '<span class="blinking-cursor"></span>';
                        scrollToBottom();
                        lastRenderTime = now;
                    }
                }

                aiMessageContainer.innerHTML = marked.parse(accumulatedText);
                const safeEncodedText = encodeURIComponent(accumulatedText).replace(/'/g, "%27");
                const toolbarHTML = `
                    <div class="mt-4 pt-3 border-t border-[var(--border-color)] flex gap-4 text-muted text-sm animate-fade-in-up">
                        <button onclick="copyToClipboard(this, '${safeEncodedText}')" class="hover:text-[var(--accent)] transition-all flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>Copier</span>
                        </button>
                    </div>`;
                aiBubble.insertAdjacentHTML('beforeend', toolbarHTML);
                scrollToBottom();

            } catch (error) {
                aiMessageContainer.innerHTML = `<p class="text-red-500 font-bold">❌ Erreur : ${error.message}</p>`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        
        loadSettings(); 
        loadDatabaseHistory(); 
        userInput.focus();
    </script>
</body>
</html>
