<div class="login-container">
  <div class="login-card">
    
    <div class="logo-circle">N</div>
    <h1>{{ isRegistering ? 'Join Nexus' : 'Welcome Back' }}</h1>
    <p class="subtitle">{{ isRegistering ? 'Create your account today' : 'Login to continue' }}</p>

    <form (submit)="onSubmit()">
      
      <div class="input-group" *ngIf="isRegistering">
        <input type="text" placeholder="Full Name" [(ngModel)]="name" name="name" required>
      </div>

      <div class="input-group">
        <input type="email" placeholder="Email Address" [(ngModel)]="email" name="email" required>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
      </div>

      <button type="submit" class="btn-submit">
        {{ isRegistering ? 'Sign Up' : 'Log In' }}
      </button>

    </form>

    <div class="divider">OR</div>

    <button type="button" class="btn-google" (click)="onGoogleLogin()">
      <span>🔵</span> Continue with Google
    </button>

    <div class="toggle-link">
      <p *ngIf="!isRegistering">
        Don't have an account? <a (click)="isRegistering = true">Sign Up</a>
      </p>
      <p *ngIf="isRegistering">
        Already have an account? <a (click)="isRegistering = false">Log In</a>
      </p>
    </div>

  </div>
</div>
